name: Deploy Manyuka Farm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "ERROR: SUPABASE_URL secret is not set in GitHub Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_KEY }}" ]; then
            echo "ERROR: SUPABASE_KEY secret is not set in GitHub Secrets!"
            exit 1
          fi
          echo "Both secrets are present ✓"

      - name: Inject secrets and version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_KEY']
          version = 'manyuka-' + subprocess.check_output(
              ['git', 'rev-parse', '--short', 'HEAD']
          ).decode().strip()

          print(f"Version: {version}")

          for filename in ('index.html', 'sw.js'):
              try:
                  with open(filename, 'r') as f:
                      content = f.read()
                  content = content.replace("'__SUPABASE_URL__'", f"'{url}'")
                  content = content.replace("'__SUPABASE_KEY__'", f"'{key}'")
                  content = content.replace('__APP_VERSION__', version)
                  with open(filename, 'w') as f:
                      f.write(content)
                  print(f"{filename}: injected ✓")
              except FileNotFoundError:
                  print(f"{filename}: not found, skipping")

          # Verify index.html
          with open('index.html', 'r') as f:
              final = f.read()
          errors = []
          if '__SUPABASE_URL__' in final: errors.append('SUPABASE_URL placeholder remains')
          if '__SUPABASE_KEY__' in final: errors.append('SUPABASE_KEY placeholder remains')
          if '__APP_VERSION__'  in final: errors.append('APP_VERSION placeholder remains')
          if errors:
              for e in errors: print(f"ERROR: {e}")
              exit(1)
          print(f"URL injected:     {url[:30]}...")
          print(f"Key injected:     {key[:20]}...")
          print(f"Version injected: {version}")
          print("SUCCESS: All placeholders replaced ✓")
          PYEOF

      - name: Verify injection worked
        run: |
          if grep -q "__SUPABASE_URL__\|__SUPABASE_KEY__\|__APP_VERSION__" index.html sw.js; then
            echo "FAIL: Placeholders found in deployed files!"
            exit 1
          fi
          echo "Verified: No placeholders in output ✓"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        
